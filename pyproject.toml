[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "steam_success"
version = "0.0.1"
description = "We're going to find out what games are good and why. Or something like that."
authors = [
  { name = "Team Steam" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.13.0"


[tool.ruff]
line-length = 99
src = ["steam_success"]
include = ["pyproject.toml", "steam_success/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["steam_success"]
force-sort-within-sections = true

